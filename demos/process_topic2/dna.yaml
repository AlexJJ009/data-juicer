project_name: topic2-dna
np: 1
skip_op_error: false
use_cache: false
cache_compress: null
ds_cache_dir: ./datasets-cache
temp_dir: ./tmp
text_keys: [sequence]
dataset_path: ./input.jsonl
export_path: ./refined.jsonl
keep_stats_in_res_ds: true
process:
  - sequence_alphabet_filter:
      seq_type: dna
      max_ambiguous_ratio: 1.0
      stats_export_path: ./alphabet_rows.jsonl
  - text_length_filter:
      text_key: sequence
      min_len: 150
      max_len: 600000
      stats_export_path: ./length_rows.jsonl
